<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#771d45">
  <title>KMARRY Administrator</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#29232a;background:#fffaf7;font-synthesis:none;font-weight:400;--wine:#771d45;--rose:#f8e9ed;--ink:#29232a;--muted:#786e73;--line:#eee3e5;--gold:#e8b96d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:999px;padding:11px 18px;background:var(--wine);color:#fff;font-weight:650}button:disabled{opacity:.55;cursor:wait}.secondary{background:#fff;color:var(--wine);border:1px solid #e3cbd3}.hidden{display:none!important}
    header{height:74px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,20px);border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:850;letter-spacing:.04em;color:var(--wine)}.brand span{color:var(--gold)}main{max-width:1120px;margin:auto;padding:34px 22px 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 35px #501b2b0b}.auth-wrap{max-width:500px;margin:35px auto}.auth-wrap h1{font-family:Georgia,serif;color:var(--wine)}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:750;color:var(--gold)}.muted{font-size:13px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px}label{font-size:13px;font-weight:700;color:#51464b}input,select{border:1px solid #dfd5d8;border-radius:10px;padding:11px 12px;background:#fff;width:100%;color:var(--ink)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.status{min-height:22px;margin:10px 0;color:var(--wine);font-size:14px}.section-title{margin:20px 0 16px;font-size:24px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button.active{background:var(--wine);color:white}.tabs button{background:#f5e8ec;color:var(--wine)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}.tag{display:inline-block;background:#f8edf0;border-radius:99px;padding:5px 9px;font-size:12px;color:#6f2946}footer{text-align:center;color:var(--muted);padding:20px;font-size:13px}
    .modal{position:fixed;inset:0;background:#1e1018aa;display:grid;place-items:center;padding:18px;z-index:10}.modal .panel{width:min(900px,100%);max-height:92vh;overflow:auto}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}.detail-grid p{margin:6px 0;overflow-wrap:anywhere}.member-photo{max-width:180px;max-height:220px;object-fit:cover;border-radius:12px}.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.edit-grid .wide{grid-column:1/-1}.edit-grid textarea{min-height:90px}.danger{background:#fff0f0;color:#a32635;border:1px solid #f2d3d6}
    @media(max-width:650px){header{height:auto;min-height:68px;padding:12px 16px;gap:10px}main{padding:24px 16px 45px}.section-title{font-size:21px}.detail-grid,.edit-grid{grid-template-columns:1fr}.edit-grid .wide{grid-column:auto}}
  </style>
</head>
<body>
  <header><div class="brand">K<span>♥</span>MARRY · Admin</div><a href="/" class="muted">Back to KMARRY</a></header>
  <main>
    <section id="loginView"><div class="auth-wrap panel"><div class="eyebrow">Administrator</div><h1>Admin sign in</h1><p class="muted">Enter the temporary administrator credentials.</p><form id="adminLoginForm"><div class="field"><label for="adminEmail">Email</label><input id="adminEmail" name="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="adminPassword">Password</label><input id="adminPassword" name="password" type="password" autocomplete="current-password" required></div><div class="status" id="loginStatus" role="status"></div><button type="submit">Sign in</button></form></div></section>
    <section id="dashboardView" class="hidden"><div class="row between"><h1 class="section-title">Administrator dashboard</h1><button class="secondary" id="signOutButton" type="button">Sign out</button></div><div class="tabs"><button id="allTab" type="button">All members</button><button id="paymentTab" type="button">Payment button requests</button></div><div class="status" id="adminStatus" role="status"></div><div class="cards" id="adminMembers"></div><button id="adminMore" class="secondary hidden" type="button">Load more</button></section>
  </main>
  <div class="modal hidden" id="memberModal" role="dialog" aria-modal="true" aria-labelledby="memberModalTitle"><div class="panel"><div class="row between"><h2 id="memberModalTitle">Member details</h2><button class="secondary" id="closeMemberModal" type="button">Close</button></div><div id="memberModalBody"></div></div></div>
  <footer>KMARRY · Administrator access</footer>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';

    const firebaseConfig={apiKey:'AIzaSyDEV5QfsK3tTWxpOh45678pBZwtoZ0wzMU',authDomain:'kmarry-5ce8a.firebaseapp.com',projectId:'kmarry-5ce8a',storageBucket:'kmarry-5ce8a.firebasestorage.app',messagingSenderId:'577718422582',appId:'1:577718422582:web:f043d44aa6616a5af25c97'};
    const functions=getFunctions(initializeApp(firebaseConfig));
    const $=id=>document.getElementById(id), safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let adminSession=sessionStorage.getItem('kmAdminSession')||'', adminFilter='all', adminCursor=null, isAdmin=false, membersByUid=new Map();
    function showDashboard(){isAdmin=true;$('loginView').classList.add('hidden');$('dashboardView').classList.remove('hidden')}
    function endSession(message=''){adminSession='';sessionStorage.removeItem('kmAdminSession');isAdmin=false;$('dashboardView').classList.add('hidden');$('loginView').classList.remove('hidden');if(message)$('loginStatus').textContent=message}
    function memberCard(member){membersByUid.set(member.uid,member);const active=member.premiumActive?`Active until ${new Date(member.activeUntilMillis).toLocaleDateString()}`:'Not active';const request=member.requestStatus?`Payment request: ${safe(member.requestStatus)} · ${member.planMonths||''} months · ₹${member.amountInr||''}`:'No payment request';const action=member.gender==='Man'&&adminFilter==='payment'&&member.requestStatus==='payment_clicked'?`<div class="row" style="margin-top:12px"><select id="premiumMonths-${safe(member.uid)}"><option value="6" ${member.planMonths===6?'selected':''}>6 months · ₹599</option><option value="12" ${member.planMonths===12?'selected':''}>12 months · ₹1,199</option></select><button type="button" data-activate="${safe(member.uid)}">${member.premiumActive?'Extend premium':'Activate premium'}</button></div>`:'';return `<article class="panel" data-member="${safe(member.uid)}"><h3>${safe(member.name||'Unnamed member')}${member.blocked?' · Blocked':''}</h3><p>${safe(member.phone||'No phone on file')} · ${safe(member.age??'Age not set')} · ${safe(member.gender||'')}</p><p class="muted">${safe([member.district,member.state].filter(Boolean).join(', '))}</p><p>${request}</p><span class="tag">${active}</span><div class="row" style="margin-top:12px"><button class="secondary" type="button" data-view="${safe(member.uid)}">Full details</button><button class="secondary" type="button" data-edit="${safe(member.uid)}">Edit</button><button class="secondary" type="button" data-block="${safe(member.uid)}" data-blocked="${member.blocked}">${member.blocked?'Unblock':'Block'}</button><button class="danger" type="button" data-delete="${safe(member.uid)}">Delete</button></div>${action}</article>`}
    function memberField(key,label,type='text',wide=false){const p=window.currentAdminMember?.profile||{},value=safe(p[key]??''),required=['name','gender','religion','disability','state','district','place','education','maritalStatus','about'].includes(key)?'required':'';return `<label class="field${wide?' wide':''}">${label}${key==='about'?`<textarea name="${key}" maxlength="1000" ${required}>${value}</textarea>`:`<input name="${key}" type="${type}" value="${value}" ${required} ${type==='number'?'min="18" max="100"':''} ${type==='url'?'maxlength="2000"':''} ${type==='text'?(key==='name'?'maxlength="80"':'maxlength="120"'):''}>`}</label>`}
    function showMember(uid,edit=false){const member=membersByUid.get(uid);if(!member)return;window.currentAdminMember=member;const p=member.profile||{},privateProfile=member.privateProfile||{};$('memberModalTitle').textContent=edit?'Edit member details':'Full member details';if(edit){$('memberModalBody').innerHTML=`<form id="memberEditForm" class="edit-grid">${memberField('name','Full name')}${memberField('gender','Gender')}${memberField('age','Age','number')}${memberField('height','Height')}${memberField('religion','Religion')}${memberField('community','Caste / community')}${memberField('disability','Disability details')}${memberField('state','State')}${memberField('district','District')}${memberField('place','Place')}${memberField('education','Education')}${memberField('occupation','Occupation')}${memberField('maritalStatus','Marital status')}${memberField('photoUrl','Profile photo URL','url',true)}${memberField('about','About me','text',true)}<label class="field">Registered phone number (sign-in)<input name="phone" type="tel" value="${safe(privateProfile.phone||'')}" maxlength="24" required></label><label class="field">Contact phone<input name="contactPhone" type="tel" value="${safe(privateProfile.contactPhone||'')}" maxlength="24" required></label><label class="field">Date of birth<input name="dateOfBirth" type="date" value="${safe(privateProfile.dateOfBirth||'')}" required></label><p class="status wide" id="memberEditStatus" role="status"></p><div class="row wide"><button type="submit">Save details</button><button type="button" class="secondary" id="cancelMemberEdit">Cancel</button></div></form>`;$('memberEditForm').addEventListener('submit',saveMemberDetails);$('cancelMemberEdit').onclick=()=>showMember(uid,false);return}
      const fields=[['Name',p.name],['Age',p.age],['Gender',p.gender],['Registered phone',privateProfile.phone],['Contact phone',privateProfile.contactPhone],['Date of birth',privateProfile.dateOfBirth],['State',p.state],['District',p.district],['Place',p.place],['Height',p.height],['Religion',p.religion],['Caste / community',p.community],['Disability details',p.disability],['Education',p.education],['Occupation',p.occupation],['Marital status',p.maritalStatus],['About me',p.about],['Blocked',member.blocked?'Yes':'No'],['Premium',member.premiumActive?'Active':'Not active'],['Premium request',member.requestStatus||'None']];const photo=p.photoUrl?`<img class="member-photo" src="${safe(p.photoUrl)}" alt="${safe(p.name||'Member')} profile photo">`:'';$('memberModalBody').innerHTML=`${photo}<div class="detail-grid">${fields.map(([label,value])=>`<p><strong>${label}:</strong> ${safe(value||'—')}</p>`).join('')}</div><p><strong>Account ID:</strong> ${safe(uid)}</p><button type="button" id="editMemberInModal">Edit details</button>`;$('editMemberInModal').onclick=()=>showMember(uid,true);}
    async function saveMemberDetails(event){event.preventDefault();const form=event.currentTarget,member=window.currentAdminMember,status=$('memberEditStatus'),button=form.querySelector('[type=submit]'),profile={};for(const key of ['name','gender','height','religion','community','disability','state','district','place','education','occupation','maritalStatus','about','photoUrl'])profile[key]=form.elements[key].value.trim();profile.age=Number(form.elements.age.value);const privateProfile={phone:form.elements.phone.value.trim(),contactPhone:form.elements.contactPhone.value.trim(),dateOfBirth:form.elements.dateOfBirth.value};button.disabled=true;status.textContent='Saving changes…';try{await httpsCallable(functions,'adminUpdateMember')({uid:member.uid,profile,privateProfile,adminSession});$('memberModal').classList.add('hidden');await loadMembers(adminFilter);$('adminStatus').textContent='Member details updated.'}catch(error){console.error(error);status.textContent=error.code==='functions/invalid-argument'?(error.message||'Check the profile values and try again.'):'Could not save member details. Check the admin session and try again.'}finally{button.disabled=false}}
    async function loadMembers(filter,more=false){if(!isAdmin)return;if(filter&&!more){adminFilter=filter;adminCursor=null;membersByUid.clear();$('adminMembers').replaceChildren();$('adminStatus').textContent='Loading…'}$('allTab').classList.toggle('active',adminFilter==='all');$('paymentTab').classList.toggle('active',adminFilter==='payment');try{const response=await httpsCallable(functions,'adminListMembers')({filter:adminFilter,cursor:more?(adminCursor||''):'',adminSession});adminCursor=response.data.nextCursor;const host=$('adminMembers');if(!response.data.members.length&&!more)host.innerHTML='<div class="panel">No members in this list.</div>';host.insertAdjacentHTML('beforeend',response.data.members.map(memberCard).join(''));$('adminStatus').textContent=`Showing ${host.querySelectorAll('[data-member]').length} member(s). Payment requests record plan selection, not payment; verify captured transactions in Razorpay before activation.`;$('adminMore').classList.toggle('hidden',!adminCursor)}catch(error){console.error(error);if(error.code==='functions/unauthenticated')endSession('Admin session expired. Sign in again.');else $('adminStatus').textContent='Could not load admin data. Confirm the session and deployed Cloud Functions.'}}
    async function signIn(email,password){const result=await httpsCallable(functions,'adminLogin')({email,password});adminSession=result.data.adminSession;sessionStorage.setItem('kmAdminSession',adminSession);$('adminPassword').value='';showDashboard();await loadMembers('all')}
    $('adminLoginForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type=submit]');button.disabled=true;$('loginStatus').textContent='Signing in…';try{await signIn(form.elements.email.value.trim(),form.elements.password.value)}catch(error){console.error(error);$('loginStatus').textContent=error.code==='functions/resource-exhausted'?'Too many attempts. Try again in 15 minutes.':error.code==='functions/unauthenticated'?'Email or password was not accepted.':'Could not sign in. Check your connection and deployed admin login function.'}finally{button.disabled=false}});
    $('signOutButton').addEventListener('click',()=>endSession());$('allTab').addEventListener('click',()=>loadMembers('all'));$('paymentTab').addEventListener('click',()=>loadMembers('payment'));$('adminMore').addEventListener('click',()=>loadMembers(undefined,true));
    $('adminMembers').addEventListener('click',async event=>{const button=event.target.closest('button');if(!button||!isAdmin)return;const uid=button.dataset.activate||button.dataset.view||button.dataset.edit||button.dataset.block||button.dataset.delete;if(!uid)return;if(button.dataset.view){showMember(uid,false);$('memberModal').classList.remove('hidden');return}if(button.dataset.edit){showMember(uid,true);$('memberModal').classList.remove('hidden');return}button.disabled=true;try{if(button.dataset.activate){const months=Number($(`premiumMonths-${uid}`)?.value),result=await httpsCallable(functions,'adminActivatePremium')({uid,months,adminSession});$('adminStatus').textContent=`Premium active through ${new Date(result.data.activeUntilMillis).toLocaleDateString()}.`}else if(button.dataset.block!==undefined){const nextBlocked=button.dataset.blocked!=='true';if(!confirm(`${nextBlocked?'Block':'Unblock'} this member?`))return;await httpsCallable(functions,'adminSetMemberBlocked')({uid,blocked:nextBlocked,adminSession});$('adminStatus').textContent=nextBlocked?'Member blocked.':'Member unblocked.'}else if(button.dataset.delete){if(!confirm('Permanently delete this member, profile, interests, and uploaded photos? This cannot be undone.'))return;await httpsCallable(functions,'adminDeleteMember')({uid,adminSession});$('adminStatus').textContent='Member and associated account data deleted.'}await loadMembers(adminFilter)}catch(error){console.error(error);$('adminStatus').textContent='Could not apply this member change. Check the admin session and try again.'}finally{button.disabled=false}});
    $('closeMemberModal').addEventListener('click',()=> $('memberModal').classList.add('hidden'));$('memberModal').addEventListener('click',event=>{if(event.target===$('memberModal'))$('memberModal').classList.add('hidden')});
    if(adminSession){showDashboard();await loadMembers('all')}
  </script>
</body>
</html>
