<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kmarry – OTP Login</title>

<style>
body{
  margin:0;
  height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#003845;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  background:#ffffff;
  width:100%;
  max-width:360px;
  padding:28px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}
h3{text-align:center;margin-bottom:18px}
input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  font-size:15px;
}
button{
  width:100%;
  padding:12px;
  font-size:16px;
  font-weight:bold;
  border:none;
  border-radius:25px;
  cursor:pointer;
}
#sendBtn{background:#00b050;color:#fff}
#verifyBtn{background:#0d6efd;color:#fff;display:none}
#otp{display:none}
#msg{margin-top:10px;font-size:14px;text-align:center}
</style>
</head>

<body>

<div class="box">
  <h3>📱 OTP Login</h3>

  <input id="phone" placeholder="Enter phone number"
         maxlength="10" inputmode="numeric">

  <div id="recaptcha-container"></div>

  <button id="sendBtn">Send OTP</button>

  <input id="otp" placeholder="Enter OTP">

  <button id="verifyBtn">Verify OTP</button>

  <div id="msg"></div>
</div>

<script type="module">

/* 🔥 Firebase imports */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  RecaptchaVerifier, 
  signInWithPhoneNumber 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔑 YOUR firebaseConfig */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

/* 🚀 Init */
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* 🌍 GLOBAL */
let confirmationResult;

/* 🔐 reCAPTCHA (invisible) */
window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  { size: "invisible" }
);

/* 📤 SEND OTP */
document.getElementById("sendBtn").onclick = async () => {

  const phone = document.getElementById("phone").value.trim();
  const msg   = document.getElementById("msg");

  if(phone.length !== 10){
    msg.textContent="❌ Enter valid phone number";
    return;
  }

  msg.textContent="Sending OTP...";
  const fullPhone = "+91" + phone;

  try{
    confirmationResult =
      await signInWithPhoneNumber(auth, fullPhone, window.recaptchaVerifier);

    document.getElementById("otp").style.display="block";
    document.getElementById("verifyBtn").style.display="block";
    msg.textContent="✅ OTP sent";
  }catch(e){
    console.error(e);
    msg.textContent="❌ OTP failed";
  }
};

/* ✅ VERIFY OTP */
document.getElementById("verifyBtn").onclick = async () => {

  const code = document.getElementById("otp").value.trim();
  const msg  = document.getElementById("msg");

  if(code.length !== 6){
    msg.textContent="❌ Enter valid OTP";
    return;
  }

  try{
    const res = await confirmationResult.confirm(code);
    const uid = res.user.uid;

    /* 🔎 CHECK PROFILE */
    const snap = await getDoc(doc(db,"profiles",uid));

    if(snap.exists()){
      location.href="search.html";
    }else{
      location.href="register.html";
    }

  }catch(e){
    console.error(e);
    msg.textContent="❌ Wrong OTP";
  }
};

</script>

</body>
</html>
