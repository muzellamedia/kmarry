<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kmarry Login</title>

<style>
body{
  margin:0;
  height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:url('https://lh3.googleusercontent.com/d/1y32Yv9BtQsuP8D2MCK8FFR780e3bugtg')
             no-repeat center center / cover;
  display:flex;
  align-items:center;
  justify-content:center;
}

#loginBox{
  width:100%;
  max-width:420px;
  padding:36px 28px;
  box-sizing:border-box;
  text-align:center;
}

label{
  display:block;
  text-align:left;
  margin:6px 0 4px;
  font-size:14px;
  color:#000;
  font-weight:500;
}

input, select{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  margin-bottom:12px;
  font-size:15px;
  background:rgba(255,255,255,0.9);
}

button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#loginBtn{
  background:#00b050;
  color:#fff;
}

#registerBtn{
  background:#001a66;
  color:#fff;
  margin-top:10px;
}

#error{
  color:#ff4d4d;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div id="loginBox">

  <!-- LOGO -->
  <img src="https://lh3.googleusercontent.com/d/1pW_lK0eIhREggZuuR8SX89Ye3xQbptG7"
       style="width:180px;margin-bottom:18px">

  <p style="color:#008000;font-size:13px;margin-bottom:18px;">
    വിവാഹം വിരൽത്തുമ്പിൽ
  </p>

  <!-- PHONE -->
  <label>Your Phone Number</label>
  <input type="tel" id="phone" placeholder="Enter phone number"
         maxlength="10" inputmode="numeric">

  <!-- DOB -->
  <label>Date of Birth</label>
  <div style="display:flex;gap:6px;">
    <select id="day"><option value="">Day</option></select>
    <select id="month"><option value="">Month</option></select>
    <select id="year"><option value="">Year</option></select>
  </div>

  <!-- LOGIN -->
  <button id="loginBtn" onclick="login()">Login</button>

  <!-- REGISTER -->
  <button id="registerBtn" onclick="goRegister()">Register Now</button>

  <div id="error"></div>

</div>

<script>
/* DOB dropdown fill */
(function fillDOB(){
  const d=document.getElementById('day');
  const m=document.getElementById('month');
  const y=document.getElementById('year');
  for(let i=1;i<=31;i++) d.innerHTML+=`<option>${i}</option>`;
  for(let i=1;i<=12;i++) m.innerHTML+=`<option>${i}</option>`;
  for(let i=new Date().getFullYear();i>=1960;i--) y.innerHTML+=`<option>${i}</option>`;
})();

/* LOGIN (placeholder – Firebase later) */
function login(){
  const phone=document.getElementById('phone').value.trim();
  const day=day.value, month=month.value, year=year.value;
  const err=document.getElementById('error');
  err.textContent="";

  if(!phone || !day || !month || !year){
    err.textContent="Please enter phone number and DOB";
    return;
  }

  // 🔥 Firebase login logic will come here
  console.log("LOGIN DATA:", phone, `${day}/${month}/${year}`);
}

/* Go to register page */
function goRegister(){
  window.location.href="register.html";
}
</script>
<script type="module">
/* 🔥 Firebase imports */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔑 YOUR firebaseConfig (ഇവിടെ നിങ്ങൾക്ക് കിട്ടിയത് paste ചെയ്യുക) */
const firebaseConfig = {
  apiKey: "AIzaSyDEV5QfsK3tTWxpOh45678pBZwtoZ0wzMU",
  authDomain: "kmarry-5ce8a.firebaseapp.com",
  projectId: "kmarry-5ce8a",
  storageBucket: "kmarry-5ce8a.firebasestorage.app",
  messagingSenderId: "577718422582",
  appId: "1:577718422582:web:f043d44aa6616a5af25c97"
};

/* 🚀 Initialize Firebase */
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* 🔐 TEMP TEST LOGIN (just to verify Firebase connected) */
signInAnonymously(auth)
  .then(() => {
    console.log("✅ Firebase connected successfully");
  })
  .catch(err => {
    console.error("❌ Firebase error", err);
  });

/* 🌍 Make available globally (later pages use this) */
window.auth = auth;
window.db   = db;
</script>

	
</body>
</html>
