<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kmarry – Login</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* 🔥 BACKGROUND MOBILE */
#pageLogin{
  display:flex;
  justify-content:center;
  align-items:flex-start;   /* 🔥 center നിന്ന് മുകളിലേക്ക് */
  padding-top:70px;         /* 🔥 എത്ര മുകളിൽ വേണമെന്ന് ഇവിടെ adjust ചെയ്യാം */
  height:100vh;

  background:url('https://lh3.googleusercontent.com/d/1qxE8D7quWxDMuZUvmbo_gdWV0zH4QWHl')
             no-repeat center center / cover;
}

/* 🔥 DESKTOP BACKGROUND */
@media (min-width:1024px){
  #pageLogin{
    background:url('https://lh3.googleusercontent.com/d/1y32Yv9BtQsuP8D2MCK8FFR780e3bugtg')
               no-repeat center center / cover;
  }
}
.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#00b050;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.login-loader{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.dot{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  animation:bounce 1.2s infinite ease-in-out;
}

.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}

@keyframes bounce{
  0%,80%,100%{transform:scale(0)}
  40%{transform:scale(1)}
}

#loginBox{
  background:none;
  width:100%;
  max-width:420px;
  padding:36px 30px;
  text-align:center;
  transform: scale(1.05);
  color:#fff;
}

input,select{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  font-size:15px;
  margin-bottom:12px;
  background:rgba(255,255,255,0.9);
  color:#333;
}

button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:25px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.login-btn{background:#00b050;color:#fff}
.register-btn{background:#001a66;color:#fff}

.login-btn.loading{
  pointer-events:none;
  background:#111;
}

.login-btn.loading span{visibility:hidden;}

.login-dots{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.login-dots i{
  width:10px;height:10px;border-radius:50%;
  animation:bounce 1.2s infinite ease-in-out;
}

.login-dots i:nth-child(1){background:#ffd43b;animation-delay:0s}
.login-dots i:nth-child(2){background:#ff4d6d;animation-delay:.15s}
.login-dots i:nth-child(3){background:#4dabf7;animation-delay:.3s}
.login-dots i:nth-child(4){background:#da77f2;animation-delay:.45s}

@keyframes bounce{
  0%,80%,100%{transform:scale(0);opacity:.3}
  40%{transform:scale(1);opacity:1}
}

#msg{margin-top:10px;font-size:14px;color:#ff8080}
</style>
</head>

<body>

<div id="pageLogin">

<div id="loginBox">


<img src="https://lh3.googleusercontent.com/d/1pW_lK0eIhREggZuuR8SX89Ye3xQbptG7"
     style="width:180px;margin-bottom:20px;display:block;margin-left:auto;margin-right:auto;">

<h3 style="color:#008000;font-size:13px;margin-bottom:12px;">
വിവാഹം വിരൽത്തുമ്പിൽ
</h3>

<a href="https://drive.usercontent.google.com/download?id=1D7k_BegQPjgutF8Sjwi2vaWl4lcX_Vex&export=download"
   target="_blank"
   style="display:inline-block;background:#990808;color:#fff;
   text-decoration:none;padding:10px 18px;border-radius:20px;
   font-size:14px;font-weight:bold;margin-bottom:18px;">
📲 Download Android App
</a>
<div style="display:flex;gap:8px;margin-bottom:14px;">

  <select id="countryCode" style="
    width:35%;
    padding:12px;
    border-radius:10px;
    font-size:15px;
">
    <option value="+91">🇮🇳 +91</option>
    <option value="+971">🇦🇪 +971</option>
    <option value="+966">🇸🇦 +966</option>
    <option value="+965">🇰🇼 +965</option>
    <option value="+974">🇶🇦 +974</option>
    <option value="+968">🇴🇲 +968</option>
</select>

<input type="tel"
    id="phone"
    placeholder="Enter phone number"
    style="
      width:65%;
      padding:12px;
      border-radius:10px;
      font-size:16px;
      color:#000;
    "
>

</div>

<!-- ✅ OTP Input (Button ന് മുകളിൽ) -->
<input id="otp"
       placeholder="Enter OTP"
       style="display:none;
              width:100%;
              padding:14px;
              border-radius:10px;
              margin-top:12px;">

<!-- ✅ Login / Verify Button -->
<button id="loginBtn" class="login-btn">
  <span id="loginText">Login</span>
  <div class="login-loader" id="loginLoader" style="display:none;">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</button>

<!-- ✅ Recaptcha Container (Button പുറത്തു വേണം) -->
<div id="recaptcha-container"></div>

<!-- ✅ Register Button -->
<button class="register-btn"
onclick="location.href='register.html'">
Register Now
</button>

<div id="msg"></div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  RecaptchaVerifier, 
  signInWithPhoneNumber 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔑 Your Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDEV5QfsK3tTWxpOh45678pBZwtoZ0wzMU",
  authDomain: "kmarry-5ce8a.firebaseapp.com",
  projectId: "kmarry-5ce8a",
  storageBucket: "kmarry-5ce8a.firebasestorage.app",
  messagingSenderId: "577718422582",
  appId: "1:577718422582:web:f043d44aa6616a5af25c97"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* 🌍 Global */
let confirmationResult;

/* 🔐 Invisible reCAPTCHA */
/* 🔐 Invisible reCAPTCHA */
window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  {
    size: "invisible"
  }
);

window.recaptchaVerifier.render().catch(console.error);



const loginBtn   = document.getElementById("loginBtn");
const loginText  = document.getElementById("loginText");
const loginLoader= document.getElementById("loginLoader");
const otpInput   = document.getElementById("otp");
const msg        = document.getElementById("msg");

	
/* Global Flag */
let isOTPSent = false;

loginBtn.onclick = async () => {

  if (!isOTPSent) {

    // --- SEND OTP ---
    const phone = document.getElementById("phone").value.trim();
    const country = document.getElementById("countryCode").value;

    if (phone.length < 6) {
      msg.textContent = "Enter valid phone number";
      return;
    }

    loginText.style.display = "none";
    loginLoader.style.display = "flex";
    loginBtn.disabled = true;

    try {
      const fullPhone = country + phone;

      if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
          size: "invisible"
        });
      }

      confirmationResult = await signInWithPhoneNumber(
        auth,
        fullPhone,
        window.recaptchaVerifier
      );

      isOTPSent = true;

      loginText.style.display = "block";
      loginLoader.style.display = "none";
      loginBtn.disabled = false;

      otpInput.style.display = "block";
      loginText.textContent = "Verify OTP";
      msg.textContent = "OTP Sent";

    } catch (e) {
      console.error(e);
      msg.textContent = "OTP Failed: " + e.message;
      loginText.style.display = "block";
      loginLoader.style.display = "none";
      loginBtn.disabled = false;
    }

  } else {

    // --- VERIFY OTP ---
    await verifyOTP();

  }
};



// ✅ OTP Verify Function (Outside click function)
async function verifyOTP() {

  const code = otpInput.value.trim();

  if (code.length !== 6) {
    msg.textContent = "Enter valid OTP";
    return;
  }

  loginText.style.display = "none";
  loginLoader.style.display = "flex";
  loginBtn.disabled = true;

  try {

    const res = await confirmationResult.confirm(code);
    const uid = res.user.uid;

    const snap = await getDoc(doc(db, "profiles", uid));

    if (snap.exists()) {
      location.href = "search.html";
    } else {
      location.href = "register.html";
    }

  } catch (e) {
    msg.textContent = "Wrong OTP";
    loginText.style.display = "block";
    loginLoader.style.display = "none";
    loginBtn.disabled = false;
  }
}


</script>

</body>
</html>
