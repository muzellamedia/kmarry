<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kmarry – Results</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#003845;
}
#results{
  max-width:720px;
  margin:auto;
  padding:14px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
}
</style>
</head>

<body>

<div id="results"></div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore,collection,query,where,getDocs,doc,getDoc }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const resultsDiv = document.getElementById("results");

let loggedUser = null;
let isPremium = false;

/* 🔐 AUTH */
onAuthStateChanged(auth, async user => {
  if(!user){
    location.href="index.html";
    return;
  }

  loggedUser = user;

  const snap = await getDoc(doc(db,"profiles",user.uid));
  if(snap.exists()){
    isPremium = snap.data().isPremium === true;
  }

  loadResults();
});

/* 🧠 UTIL */
function calculateAge(dob){
  if(!dob) return "";
  const [d,m,y] = dob.split("/");
  const birth = new Date(y,m-1,d);
  return new Date().getFullYear() - birth.getFullYear();
}

function isLoggedUserPremium(){
  return isPremium;
}

/* 🔍 LOAD RESULTS */
async function loadResults(){

  const params = new URLSearchParams(location.search);

  const minAge = Number(params.get("minAge") || 18);
  const maxAge = Number(params.get("maxAge") || 65);
  const caste  = params.get("caste") || "";

  let q = query(
    collection(db,"profiles"),
    where("age",">=",minAge),
    where("age","<=",maxAge)
  );

  if(caste){
    q = query(q, where("caste","==",caste));
  }

  const snap = await getDocs(q);

  resultsDiv.innerHTML = "";

  snap.forEach(docSnap=>{
    const p = docSnap.data();
    renderCard(p);
  });
}

/* 🎴 CARD RENDER */
function renderCard(p){

  const card = document.createElement("div");
  card.className = "card";

  const photoHtml = p.photoUrl
    ? `<img src="${p.photoUrl}" style="width:100%;height:260px;object-fit:cover;border-radius:12px;">`
    : "";

  const buttonHtml = `
    <button style="padding:10px 18px;border:none;border-radius:22px;
    background:#0d6efd;color:#fff;font-weight:bold;">
      ❤️ Send Interest
    </button>
  `;

  card.innerHTML = `
    ${photoHtml}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:14px;">

      <div><b>Name</b><br>${p.name || ""}</div>
      <div><b>Age</b><br>${calculateAge(p.dob) || p.age || "N/A"}</div>

      <div><b>Gender</b><br>${p.gender || ""}</div>
      <div><b>Height</b><br>${p.height || ""}</div>

      <div><b>Religion</b><br>${p.religion || ""}</div>
      <div><b>Caste</b><br>${p.caste || ""}</div>

      <div><b>Marital Status</b><br>${p.maritalStatus || ""}</div>
      <div><b>Children</b><br>${p.children || "0"}</div>

      <div><b>Family Type</b><br>${p.familyType || ""}</div>
      <div><b>Family Status</b><br>${p.familyStatus || ""}</div>

      <div><b>Brothers</b><br>${p.brothers || "0"}</div>
      <div><b>Sisters</b><br>${p.sisters || "0"}</div>

      <div><b>Body Type</b><br>${p.bodyType || ""}</div>
      <div><b>Complexion</b><br>${p.complexion || ""}</div>

      <div><b>Education</b><br>${p.education || ""}</div>
      <div><b>Job</b><br>${p.job || ""}</div>

      <div><b>District</b><br>${p.district || ""}</div>
      <div><b>Native Place</b><br>${p.nativePlace || ""}</div>
    </div>

    ${
      isLoggedUserPremium()
      ? `<div style="margin-top:12px;background:#fff7ed;padding:10px;border-radius:10px">
           <b>Full Address</b><br>${p.fullAddress || ""}
         </div>`
      : `<div style="margin-top:12px;padding:12px;border-radius:10px;background:#f1f5f9;text-align:center">
           🔒 Address hidden for free users<br>
           <button onclick="location.href='premium.html'"
             style="margin-top:6px;background:#ffd700;border:none;padding:6px 14px;border-radius:20px;font-weight:bold;">
             💎 Upgrade to Premium
           </button>
         </div>`
    }

    <div style="margin-top:12px;background:#f8fafc;padding:10px;border-radius:10px">
      <b>About Me</b><br>${p.about || ""}
    </div>

    ${
      isLoggedUserPremium()
      ? `<div style="display:flex;gap:10px;margin-top:12px">
           ${p.phone1 ? `<a href="tel:${p.phone1}" style="flex:1;background:#e6fffa;border:2px solid #00b050;
           padding:12px;text-align:center;border-radius:10px;font-weight:bold">📞 ${p.phone1}</a>`:""}
           ${p.phone2 ? `<a href="tel:${p.phone2}" style="flex:1;background:#e0f2fe;border:2px solid #0284c7;
           padding:12px;text-align:center;border-radius:10px;font-weight:bold">📞 ${p.phone2}</a>`:""}
         </div>`
      : `<div style="margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;text-align:center">
           🔒 Contact hidden<br>
           <button onclick="location.href='premium.html'"
             style="margin-top:6px;background:red;color:#fff;border:none;
             padding:8px 18px;border-radius:20px;font-weight:bold">
             💎 Upgrade ₹599
           </button>
         </div>`
    }

    <div style="text-align:center;margin-top:14px">
      ${buttonHtml}
    </div>
  `;

  resultsDiv.appendChild(card);
}

</script>

</body>
</html>
